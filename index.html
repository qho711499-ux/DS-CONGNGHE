<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn Tập Đúng/Sai Công Nghệ 11 - GHK1</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --success-color: #16a34a;
            --error-color: #dc2626;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .quiz-container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 800px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            font-size: 1.5rem;
            margin-bottom: 25px;
        }

        .score-section {
            text-align: center;
            font-size: 1.15rem;
            font-weight: bold;
            margin-bottom: 25px;
            padding: 20px;
            background-color: #eff6ff;
            border-radius: 8px;
            border: 2px solid #bfdbfe;
            display: none;
            line-height: 1.6;
        }

        .question-block {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e2e8f0;
        }

        .question-block:last-child {
            border-bottom: none;
            margin-bottom: 15px;
        }

        .question-title {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 15px;
            line-height: 1.5;
            color: var(--primary-color);
        }

        .statement-item {
            background-color: #f1f5f9;
            margin-bottom: 10px;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
        }

        .statement-text {
            font-size: 0.95rem;
            flex-grow: 1;
        }

        .btn-group {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .opt-btn {
            border: 1px solid #cbd5e1;
            background-color: #fff;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .opt-btn.selected-d {
            background-color: #2563eb;
            color: white;
            border-color: #2563eb;
        }

        .opt-btn.selected-s {
            background-color: #475569;
            color: white;
            border-color: #475569;
        }

        .statement-item.correct-row {
            border: 2px solid var(--success-color);
            background-color: #f0fdf4;
        }

        .statement-item.incorrect-row {
            border: 2px solid var(--error-color);
            background-color: #fef2f2;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="quiz-container">

        <div id="score-section" class="score-section"></div>

        <div id="quiz-container"></div>

        <button class="btn" id="submit-btn" onclick="checkAllAnswers()">Nộp bài</button>
    </div>

                    "a) Chăn nuôi nông hộ nhỏ lẻ, tự phát sẽ tiếp tục được khuyến khích mở rộng không giới hạn...",
                    "b) Chăn nuôi thông minh kết hợp công nghệ số, IoT và tự động hóa sẽ giúp giảm sức lao động...",
                    "c) Phát triển chăn nuôi phải gắn liền với trách nhiệm xã hội, bảo vệ môi trường...",
                    "d) Việc ứng dụng công nghệ sinh học và quy trình VietGAP là chìa khóa tạo ra sản phẩm an toàn..."
                ],
                answers: ["S", "D", "D", "D"]
            }
        ];

        let userChoices = quizData.map(() => [null, null, null, null]);
        let isSubmitted = false;

        function renderQuiz() {
            const container = document.getElementById("quiz-container");
            container.innerHTML = "";

            quizData.forEach((q, qIndex) => {
                const questionBlock = document.createElement("div");
                questionBlock.className = "question-block";

                let statementsHTML = "";
                q.statements.forEach((st, sIndex) => {
                    statementsHTML += `
                        <div class="statement-item" id="row-${qIndex}-${sIndex}">
                            <div class="statement-text">${st}</div>
                            <div class="btn-group">
                                <button class="opt-btn" id="btn-${qIndex}-${sIndex}-D" onclick="selectChoice(${qIndex}, ${sIndex}, 'D')">Đúng</button>
                                <button class="opt-btn" id="btn-${qIndex}-${sIndex}-S" onclick="selectChoice(${qIndex}, ${sIndex}, 'S')">Sai</button>
                            </div>
                        </div>
                    `;
                });

                questionBlock.innerHTML = `
                    <div class="question-title">${q.title}</div>
                    ${statementsHTML}
                `;
                container.appendChild(questionBlock);
            });
        }

        function selectChoice(qIndex, sIndex, choice) {
            if (isSubmitted) return;

            userChoices[qIndex][sIndex] = choice;

            const btnD = document.getElementById(`btn-${qIndex}-${sIndex}-D`);
            const btnS = document.getElementById(`btn-${qIndex}-${sIndex}-S`);

            btnD.className = choice === 'D' ? 'opt-btn selected-d' : 'opt-btn';
            btnS.className = choice === 'S' ? 'opt-btn selected-s' : 'opt-btn';
        }

        function checkAllAnswers() {
            let unansweredCount = 0;
            userChoices.forEach(q => {
                q.forEach(c => {
                    if (c === null) unansweredCount++;
                });
            });

            if (unansweredCount > 0) {
                if (!confirm(`Bạn còn ${unansweredCount} ý chưa trả lời. Bạn có chắc chắn muốn nộp bài không?`)) {
                    return;
                }
            }

            isSubmitted = true;
            let totalCorrectQuestions = 0;
            let totalCorrectStatements = 0;
            let totalStatements = quizData.length * 4;

            quizData.forEach((q, qIndex) => {
                let questionCorrect = true;
                q.answers.forEach((ans, sIndex) => {
                    const row = document.getElementById(`row-${qIndex}-${sIndex}`);
                    const userChoice = userChoices[qIndex][sIndex];

                    if (userChoice === ans) {
                        row.classList.add("correct-row");
                        totalCorrectStatements++;
                    } else {
                        row.classList.add("incorrect-row");
                        questionCorrect = false;
                    }
                });

                if (questionCorrect) {
                    totalCorrectQuestions++;
                }
            });

            // Hiển thị kết quả điểm số
            const scoreSection = document.getElementById("score-section");
            scoreSection.style.display = "block";
            scoreSection.innerHTML = `
                🎉 <strong>Hoàn thành bài ôn!</strong><br>
                - Số câu đúng tuyệt đối (cả 4 ý): <strong>${totalCorrectQuestions} / ${quizData.length}</strong> câu<br>
                - Tổng số ý trả lời đúng: <strong>${totalCorrectStatements} / ${totalStatements}</strong> ý
            `;

            // Đổi nút nộp bài thành nút làm lại
            const submitBtn = document.getElementById("submit-btn");
            submitBtn.innerText = "Làm lại bài ôn";
            submitBtn.onclick = function() {
                location.reload();
            };

            // Cuộn lên đầu trang để xem điểm
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        renderQuiz();
    </script>
</body>
</html>
